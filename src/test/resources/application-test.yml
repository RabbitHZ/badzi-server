spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret
          google:
            client-id: test-client-id
            client-secret: test-client-secret
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ssl:
        enabled: false

app:
  jwt:
    secret: test-secret-key-for-testing-only-min-32-chars-long
    access-token-expiry: 3600
    refresh-token-expiry: 86400
  encryption:
    key: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1jaGFycy1sb25n
    salt: test-hash-salt
