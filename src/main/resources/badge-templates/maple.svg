<svg width="150" height="28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="50%"  style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC5500;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M 5 2 L 145 2 L 148 5 L 148 23 L 145 26 L 5 26 L 2 23 L 2 5 Z"
        fill="#CC5500" stroke="#CC5500" stroke-width="1"/>
  <path d="M 6 4 L 144 4 L 146 6 L 146 22 L 144 24 L 6 24 L 4 22 L 4 6 Z"
        fill="url(#mainGrad)"/>
  <rect x="8" y="6" width="134" height="2" fill="#FF9500" opacity="0.6" rx="1"/>
  <circle cx="10" cy="14" r="2" fill="#FF9500" opacity="0.8"/>
  <circle cx="140" cy="14" r="2" fill="#FF9500" opacity="0.8"/>
  <text x="75" y="18" font-family="Arial, sans-serif" font-size="11"
        font-weight="bold" fill="white" text-anchor="middle"
        filter="url(#textShadow)">
    {{label}}: {{today}} / {{total}}
  </text>
</svg>
