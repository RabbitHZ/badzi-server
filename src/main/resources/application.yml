server:
  # Cloud Run 등 리버스 프록시 뒤에서 원 요청의 scheme(https)/host를
  # X-Forwarded-* 헤더로부터 인식하도록 한다. 이게 없으면 Swagger가
  # 생성하는 server URL이 http:// 로 나와 Mixed Content로 차단된다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:badzi}
    username: ${DB_USER:badzi}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiry: ${APP_JWT_ACCESS_EXPIRY:3600}
    refresh-token-expiry: ${APP_JWT_REFRESH_EXPIRY:604800}
  encryption:
    key: ${APP_ENCRYPTION_KEY}
    salt: ${APP_HASH_SALT}
  base-url: ${APP_BASE_URL:http://localhost:8080}